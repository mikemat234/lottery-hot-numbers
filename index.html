<meta charset="utf-8">
<title>PA Lottery Hot Numbers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1522">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hot Numbers">

<style>
  :root{
    --ink:#0e1522;
    --panel:#18202f;
    --panel-2:#202a3d;
    --line:rgba(255,255,255,.09);
    --text:#f3f6fc;
    --muted:#93a0ba;
    --muted-2:#6b789a;
    --gold:#f5c542;
    --accent:#2fd08a;            /* overridden per game */
    --accent-soft:rgba(47,208,138,.16);
    --radius:18px;
    --ball:clamp(52px,15vw,64px);
    --shadow:0 10px 30px -12px rgba(0,0,0,.7);
    font-synthesis-weight:none;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:
      radial-gradient(140% 90% at 50% -8%, rgba(79,157,255,.10), transparent 60%),
      radial-gradient(120% 70% at 50% -6%, rgba(245,197,66,.06), transparent 55%),
      var(--ink);
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(40px + env(safe-area-inset-bottom));
       background:linear-gradient(180deg, rgba(255,255,255,.015), transparent 240px);}

  /* ---------- top bar (header + switcher pin together) ---------- */
  .topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:0 16px;
    background:rgba(14,21,34,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  header{
    margin:0 -16px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
    background:linear-gradient(180deg, rgba(14,21,34,.96), rgba(14,21,34,.86));
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brandline{display:flex;align-items:center;gap:9px}
  .clover{font-size:22px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
  h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
  .sub{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2)}
  .stamp{color:var(--gold);font-weight:600}

  /* ---------- game switcher ---------- */
  nav{
    margin:0 -16px;padding:10px 12px;
    display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
    background:linear-gradient(180deg, rgba(14,21,34,.92), rgba(14,21,34,.66));
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    -webkit-overflow-scrolling:touch;
  }
  nav::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);font-size:13.5px;font-weight:650;letter-spacing:-.01em;
    padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
    transition:transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease;
    display:flex;align-items:center;gap:7px;
  }
  .tab .pip{width:9px;height:9px;border-radius:50%;background:var(--tabc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tabc) 22%, transparent)}
  .tab[aria-selected="true"]{color:var(--text);background:var(--panel-2);border-color:color-mix(in srgb,var(--tabc) 50%, var(--line))}
  .tab:active{transform:scale(.96)}
  .tab:focus-visible{outline:2px solid var(--tabc);outline-offset:2px}

  /* ---------- panel ---------- */
  main{padding-top:18px}
  .panel{display:none;animation:rise .28s ease both}
  .panel.on{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .card + .card{margin-top:14px}

  /* hero */
  .hero{padding:18px 16px 20px;position:relative}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90% 60% at 50% 0, var(--accent-soft), transparent 70%)}
  .eyebrow{position:relative;display:flex;align-items:center;gap:8px;
    text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:700;color:var(--accent)}
  .eyebrow .ln{height:1px;flex:1;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,transparent),transparent)}
  .hero h2{position:relative;margin:9px 0 2px;font-size:17px;font-weight:750;letter-spacing:-.01em}
  .hero p.note{position:relative;margin:0 0 15px;color:var(--muted);font-size:13px;max-width:40ch}

  .balls{position:relative;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .ball{
    width:var(--ball);height:var(--ball);border-radius:50%;
    display:grid;place-items:center;font-weight:800;font-size:calc(var(--ball) * .42);
    letter-spacing:-.02em;flex:0 0 auto;
    background:radial-gradient(circle at 32% 26%, #ffffff, #e7ecf5 62%, #cfd8e8);
    color:#141b28;box-shadow:0 6px 14px -6px rgba(0,0,0,.6), inset 0 -3px 6px rgba(120,140,170,.35), inset 0 2px 3px #fff;
  }
  .ball.special{color:#fff;
    background:radial-gradient(circle at 32% 26%, color-mix(in srgb,var(--accent) 78%,#fff), var(--accent) 60%, color-mix(in srgb,var(--accent) 70%,#000));
    box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 60%,transparent), inset 0 -3px 6px rgba(0,0,0,.28), inset 0 2px 3px rgba(255,255,255,.5);}
  .plus{align-self:center;color:var(--muted);font-weight:700;font-size:20px;padding:0 1px}
  .sp-tag{width:100%;margin-top:11px;display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px}
  .sp-tag b{color:var(--text);font-weight:650}

  /* section */
  .sec{padding:16px}
  .sec h3{margin:0 0 3px;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .sec .cap{margin:0 0 14px;color:var(--muted);font-size:12.5px}

  .row{display:grid;grid-template-columns:var(--ball-sm) 44px 1fr;align-items:center;gap:11px;--ball-sm:34px}
  .row + .row{margin-top:9px}
  .row .mini{
    width:var(--ball-sm);height:var(--ball-sm);border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:13.5px;color:#141b28;
    background:radial-gradient(circle at 32% 26%, #fff, #dee5f0 70%);
    box-shadow:inset 0 -2px 4px rgba(120,140,170,.3), inset 0 1px 2px #fff;
  }
  .row .mini.special{color:#fff;background:radial-gradient(circle at 32% 26%, color-mix(in srgb,var(--accent) 80%,#fff), var(--accent) 65%)}
  .row .ct{font-size:13px;font-weight:700;color:var(--text);text-align:right}
  .row .ct span{color:var(--muted);font-weight:500;font-size:11px}
  .track{height:10px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
  .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,#0000),var(--accent));
    box-shadow:0 0 12px -2px color-mix(in srgb,var(--accent) 70%,transparent);transition:width .5s cubic-bezier(.22,1,.36,1)}
  .row.top .mini{box-shadow:0 0 0 2px var(--accent), inset 0 -2px 4px rgba(120,140,170,.3)}

  .more{margin-top:15px;width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);
    font-size:13px;font-weight:650;padding:11px;border-radius:12px;cursor:pointer;transition:.15s}
  .more:active{transform:scale(.98)}
  .more:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .hidden{display:none}

  .divider{height:1px;background:var(--line);margin:2px 16px}

  .latest{padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .latest .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);font-weight:700}
  .latest .nums{display:flex;gap:6px;flex-wrap:wrap}
  .chip{min-width:26px;height:26px;padding:0 6px;border-radius:8px;display:grid;place-items:center;
    font-size:12.5px;font-weight:700;background:var(--panel);border:1px solid var(--line);color:var(--text)}
  .chip.special{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}

  /* footer */
  footer{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.02)}
  footer .ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:6px}
  footer p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
  footer p + p{margin-top:8px}
  .credit{text-align:center;color:var(--muted-2);font-size:11px;margin:18px 0 4px}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

function buildPanel(key){

  const panel = el('section','panel');

    const maxS = g.specialFreq[0].ct;
    const s2 = el('div','sec');
    s2.innerHTML = `<h3>Hot ${g.specialName}</h3>
      <p class="cap">The ${g.specialName} is drawn separately. Top hitters over ${g.drawCount} draws.</p>`;
    const slist = el('div');
    g.specialFreq.slice(0,6).forEach((o,i)=>{
      const pct = Math.round(o.ct/maxS*100);
      const row = el('div','row'+(i===0?' top':''));
      row.innerHTML = `${ball(o.n,'mini special')}
        <div class="ct">${o.ct}<span>&times;</span></div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>`;
      slist.appendChild(row);
    });
    s2.appendChild(slist);
    chart.appendChild(s2);
  }
  panel.appendChild(chart);

  /* ---- latest draw ---- */
  const lt = el('div','card');
  const nums = g.latest.main.map(n=>`<span class="chip">${n}</span>`).join('') +
    (g.latest.special!=null ? `<span class="chip special">${g.latest.special}</span>` : '');
  lt.innerHTML = `<div class="latest">
      <span class="lbl">Most recent draw · ${fmtDate(g.latest.date)}</span>
      <div class="nums">${nums}</div>
    </div>`;
  panel.appendChild(lt);

  /* ---- disclaimer ---- */
  const foot = el('footer');
  foot.innerHTML = `
    <div class="ttl"><span>⚠️</span> Read this before you bet</div>
    <p>Every lottery draw is random. Each number has the same chance every single time, so past "hot" numbers do <b>not</b> make a number more likely to come up next. This just shows what has hit most lately &mdash; a fun way to pick, not a system that beats the odds.</p>
    <p>Play for entertainment and only with money you can afford to lose. Must be 18+. Problem gambling help: <b>1-800-GAMBLER</b>.</p>`;
  panel.appendChild(foot);

  return panel;
}

/* ---- build tabs + panels ---- */
const tabs = document.getElementById('tabs');
const stage = document.getElementById('stage');

ORDER.forEach((key,idx)=>{
  const t = el('button','tab');
  t.setAttribute('role','tab');
  t.id = 'tab-'+key;
  t.setAttribute('aria-controls','panel-'+key);
  t.style.setProperty('--tabc', ACCENTS[key].a);
  t.innerHTML = `<span class="pip"></span>${SHORT[key]}`;
  t.addEventListener('click', ()=>select(key));
  tabs.appendChild(t);
  stage.appendChild(buildPanel(key));
});

function select(key){
  ORDER.forEach(k=>{
    const on = k===key;
    document.getElementById('tab-'+k).setAttribute('aria-selected', on);
    document.getElementById('panel-'+k).classList.toggle('on', on);
  });
  try{ localStorage.setItem('pa-lotto-game', key); }catch(e){}
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

let start = 'cash5';
try{ const s=localStorage.getItem('pa-lotto-game'); if(s && DATA.games[s]) start=s; }catch(e){}
document.getElementById('stamp').textContent = 'through ' + fmtDate(DATA.updated) + ', ' + DATA.updated.slice(0,4);
select(start);
